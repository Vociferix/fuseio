name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update --no-self-update stable
      - run: rustup component add rustfmt
      - run: cargo fmt --check

  # Cross-compiles the platforms without a native job below, and gives the same
  # signal as those jobs minutes sooner. Platform-specific `cfg` blocks only
  # compile on their own target, so this is what catches a typo in one of them.
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - x86_64-unknown-freebsd
    steps:
      - uses: actions/checkout@v4
      - run: rustup update --no-self-update stable
      - run: rustup component add clippy
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cross-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cross-${{ matrix.target }}-
      # No `cargo test`: these targets can be compiled here but not run.
      - run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: rustup update --no-self-update stable
      - run: rustup component add clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-
      # `-D warnings` goes to clippy rather than `RUSTFLAGS`, so a warning in a
      # dependency can't fail the build.
      - run: cargo clippy --all-targets -- -D warnings
      # The tests mount for real, so the helper is a requirement rather than
      # something they skip over. `fuse3` carries `fusermount` as well as
      # `fusermount3`, and installing it when it is already present costs
      # nothing.
      - name: Install the fusermount helper
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          ls -l /dev/fuse
      # `TMPDIR` keeps the mountpoint out of the shared `/tmp`: nothing may
      # `stat` it while a test holds it, since no server is answering
      # `FUSE_INIT`.
      - env:
          TMPDIR: ${{ runner.temp }}
        run: cargo test

      # `DirectMount` calls `mount(2)` itself, so the tests for it need the
      # privilege to mount. A user namespace supplies it without root, which
      # also keeps the mounts out of the runner's own namespace, so a test that
      # dies holding one leaves nothing behind. Ubuntu ships an AppArmor
      # restriction that would refuse the namespace; the sysctl is absent on
      # kernels that don't have it.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -e "$knob" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "no AppArmor restriction on this kernel"
          fi
      - name: Test mounting without a helper
        if: runner.os == 'Linux'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          unshare --user --map-root-user --mount -- \
            cargo test --test direct -- --ignored

  test-freebsd:
    name: test (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub hosts no FreeBSD runner, so this is a VM on the Linux one. It is
      # the only third-party action here; consider pinning it to a commit SHA.
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo clippy --all-targets -- -D warnings
            cargo test
            # The same tests run here once `src/mount/direct/bsd.rs` stops
            # being `todo!()`. This VM is already root, so no namespace or
            # sysctl is needed -- only the line below.
            #
            #   cargo test --test direct -- --ignored
