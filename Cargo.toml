[package]
name = "fuseio"
version = "0.1.0"
edition = "2024"

[dependencies]
aligned-vec = "0.6.4"
arrayvec = "0.7.6"
async-bounds = "0.1.0"
bitflags = "2.11.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
compio = { version = "0.18.0", features = ["event", "fs"] }
futures-util = { version = "0.3.32", default-features = false }
nix = { version = "0.31.2", features = ["user", "process", "fs"] }
page_size = "0.6.0"
